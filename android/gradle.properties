org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# The project (E:) and the pub cache (C:) are on different drives, which breaks
# Kotlin incremental compilation on Windows ("Could not close incremental caches").
kotlin.incremental=false

# Keep builds within this PC's memory: Kotlin compiles inside the Gradle
# process (no second daemon) and at most two tasks run at once.
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=2
